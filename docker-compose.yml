services:
  cardexporter:
    image: videreproject/mtgosdk:headless
    container_name: cardexporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISPLAY=:99
      - WINEDEBUG=-all
      - TZ=America/Los_Angeles
      - CARDEXPORTER_POSTGRES_HOST=postgres
      - CARDEXPORTER_POSTGRES_PORT=5432
    volumes:
      - .:/workspace
      - carddata-wine-prefix:/home/wine/.wine
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/xvfb-entrypoint.sh"]
    command: ["wine-run", "CardExporter/CardExporter.csproj", "schedule"]
    networks:
      - mtgo-db-shared

  cardexporter-prices:
    image: videreproject/mtgosdk:headless
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISPLAY=:99
      - WINEDEBUG=-all
      - TZ=Europe/Berlin
      - CARDEXPORTER_SCHEDULE_TIME_ZONE=Europe/Berlin
      - CARDEXPORTER_SCHEDULE_WINDOWS=Monday=05:45-06:15;Tuesday=05:45-06:15;Wednesday=05:45-06:15;Thursday=05:45-06:15;Friday=05:45-06:15;Saturday=05:45-06:15;Sunday=05:45-06:15
      - CARDEXPORTER_SCHEDULE_POLL_MINUTES=30
      - CARDEXPORTER_POSTGRES_HOST=postgres
      - CARDEXPORTER_POSTGRES_PORT=5432
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/xvfb-entrypoint.sh"]
    command: ["wine-run", "CardExporter/CardExporter.csproj", "schedule", "--schedule-job", "sync-prices"]
    networks:
      - mtgo-db-shared

volumes:
  carddata-wine-prefix:

networks:
  mtgo-db-shared:
    name: mtgo-db-shared
    external: true
